# ============================================
# nginx reverse proxy para SIGGO
# ============================================
# Ruta: /etc/nginx/sites-available/siggo
# Activar: ln -s /etc/nginx/sites-available/siggo /etc/nginx/sites-enabled/
# Probar:  nginx -t
# Aplicar: systemctl reload nginx
# ============================================

# ── Redirección HTTP → HTTPS ──
server {
    listen 80;
    server_name tudominio.com;
    return 301 https://$host$request_uri;
}

# ── Servidor HTTPS ──
server {
    listen 443 ssl http2;
    server_name tudominio.com;

    # ── Certificado SSL ──
    # Con Let's Encrypt (gratis):
    #   certbot --nginx -d tudominio.com
    ssl_certificate     /etc/letsencrypt/live/tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tudominio.com/privkey.pem;

    # ── Seguridad TLS ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    # ── Proxy a Waitress ──
    # Puerto alineado con el default de main.py (PORT=8080). Si usan otro
    # puerto, ajustar aquí o definir la variable PORT.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Timeouts ──
        proxy_connect_timeout 60s;
        # 300s para cubrir el análisis con IA (Gemini, timeout interno 120s)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # ── Limitar tamaño de upload ──
        client_max_body_size 15M;
    }
}
