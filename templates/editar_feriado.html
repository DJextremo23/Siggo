<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Feriado — SIGGO</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin/editar_form.css') }}">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <!-- ==========================================================
         PÁGINA: Editar Feriado (Administrador)
         Permite modificar la fecha y descripción de un feriado existente.
         Secciones: Cabecera, Alerta de error, Formulario de edición, JavaScript.
    ========================================================== -->

{% set active_page = 'feriados' %}
{% include 'menu.html' %}

<div class="content">

    <!-- ===== CABECERA: Título y descripción de la página de edición ===== -->
    <div class="header-admin">
        <h1>Editar Feriado</h1>
        <p>Modificar información del feriado</p>
    </div>

    <!-- ===== ALERTA DE ERROR: Muestra el mensaje de error si la validación falla ===== -->
    {% if error %}
    <div class="alert-error" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- ===== FORMULARIO DE EDICIÓN: Permite modificar fecha y descripción del feriado ===== -->
    <div class="card">

        <form method="POST" action="{{ url_for('actualizar_feriado', id=data.id_feriado) }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="field">
                <label for="fecha" class="field-label">Fecha</label>
                <div class="field-input">
                    <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <input type="text" id="fecha" name="fecha" value="{{ data.fecha }}" required>
                </div>
            </div>

            <div class="field">
                <label for="descripcion" class="field-label">Descripción</label>
                <div class="field-input">
                    <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                    <input type="text" id="descripcion" name="descripcion" value="{{ data.descripcion }}" required>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('feriados') }}" class="btn btn-cancel">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    Cancelar
                </a>
                <button type="submit" class="btn btn-save">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Guardar Cambios
                </button>
            </div>

        </form>

    </div>

</div>

<!-- ===== JAVASCRIPT: Inicializa el selector de fecha flatpickr y muestra alertas de error/éxito con SweetAlert2 ===== -->
<script nonce="{{ csp_nonce() }}">
flatpickr("#fecha", {
    dateFormat: "Y-m-d",
    locale: "es"
});
</script>

{% if error %}
<script nonce="{{ csp_nonce() }}">
Swal.fire({
    icon: 'error',
    title: 'Error',
    text: '{{ error }}',
    confirmButtonColor: '#e74c3c'
});
</script>
{% endif %}

{% if success %}
<script nonce="{{ csp_nonce() }}">
Swal.fire({
    icon: 'success',
    title: 'Actualizado',
    text: 'El feriado se actualizó correctamente',
    confirmButtonColor: '#27ae60'
});
</script>
{% endif %}

</body>
</html>
