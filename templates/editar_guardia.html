<!DOCTYPE html>
<!-- Página: Editar Guardia (vista administrador) — Formulario para modificar los datos de una guardia asignada -->
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Guardia — SIGGO</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin/editar_form.css') }}">
</head>

<body>

{% set active_page = 'guardias' %}
{% include 'menu.html' %}

<div class="content">

    <!-- ENCABEZADO DE PÁGINA -->
    <div class="header-admin">
        <h1>Editar Guardia</h1>
        <p>Modifica los datos de la guardia asignada</p>
    </div>

    <!-- FORMULARIO DE EDICIÓN DE GUARDIA -->
    <div class="card">

        <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="field">
                <label for="id_usuario" class="field-label">Fiscalizador</label>
                <div class="field-input">
                    <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <select name="id_usuario" id="id_usuario" required>
                        {% for f in fiscalizadores %}
                        <option value="{{ f.id_usuario }}"
                            {% if f.id_usuario == guardia.id_usuario %}selected{% endif %}>
                            {{ f.nombre }} {{ f.apellidos }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="fecha_guardia" class="field-label">Fecha</label>
                <div class="field-input">
                    <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <input type="date" id="fecha_guardia" name="fecha_guardia" value="{{ guardia.fecha_guardia }}" required>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('ver_guardias') }}" class="btn btn-cancel">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    Cancelar
                </a>
                <button type="submit" class="btn btn-save">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Actualizar
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
