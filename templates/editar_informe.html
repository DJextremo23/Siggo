<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Informe — SIGGO</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='fiscal/editar_informe.css') }}">
</head>

<body>

{% set active_page = 'mis_informes' %}
{% include 'menu.html' %}

<div class="content">

    <!-- Página: Editar Informe — Formulario para modificar los datos de un informe existente -->

    <!-- Cabecera de la página -->
    <div class="page-header">
        <div class="page-header-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
        </div>
        <div class="page-header-text">
            <h1>Editar Informe</h1>
            <p>Modifique los datos del informe de fiscalización</p>
        </div>
    </div>

    <!-- Formulario de edición: título, descripción, archivo actual, reemplazo de archivo y botones de acción -->
    <div class="card">

        <div class="form-header-bar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <span>Formulario de edición</span>
        </div>

        <form method="POST" enctype="multipart/form-data" class="edit-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <!-- TITULO -->
            <div class="field">
                <label for="titulo" class="field-label">Título</label>
                <div class="field-input">
                    <svg class="field-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    <input type="text"
                           id="titulo"
                           name="titulo"
                           value="{{ informe.titulo }}"
                           placeholder="Título del informe"
                           required>
                </div>
            </div>

            <!-- DESCRIPCION -->
            <div class="field">
                <label for="descripcion" class="field-label">Descripción</label>
                <div class="field-input field-input-textarea">
                    <svg class="field-icon field-icon-top" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"/>
                        <line x1="8" y1="12" x2="21" y2="12"/>
                        <line x1="8" y1="18" x2="21" y2="18"/>
                        <line x1="3" y1="6" x2="3.01" y2="6"/>
                        <line x1="3" y1="12" x2="3.01" y2="12"/>
                        <line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                    <textarea id="descripcion"
                              name="descripcion"
                              rows="4"
                              placeholder="Descripción del informe"
                              required>{{ informe.descripcion }}</textarea>
                </div>
            </div>

            <!-- ARCHIVO ACTUAL -->
            <div class="field">
                <label class="field-label">Archivo Actual</label>
                <div class="field-input field-input-readonly">
                    <svg class="field-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                        <polyline points="13 2 13 9 20 9"/>
                    </svg>
                    <input type="text"
                           value="{{ informe.nombre_archivo }}"
                           readonly
                           class="readonly-input">
                </div>
            </div>

            <!-- REEMPLAZAR ARCHIVO -->
            <div class="field">
                <label for="archivo" class="field-label">Reemplazar Archivo</label>
                <div class="field-input">
                    <svg class="field-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <input type="file"
                           id="archivo"
                           name="archivo"
                           accept=".xlsx,.xlsm"
                           class="file-input">
                </div>
            </div>

            <!-- BOTONES -->
            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                    Actualizar Informe
                </button>

                <a href="{{ url_for('informe.mis_informes') }}"
                   class="btn-cancel">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
