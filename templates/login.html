<!DOCTYPE html>
{# Descripción: Página de inicio de sesión del sistema SIGGO #}
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar Sesión — SIGGO</title>
<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body class="login-body">

<div class="login-wrapper">

    <!-- SECCIÓN: Panel izquierdo con la marca y logo del sistema -->
    <div class="login-brand">
        <div class="brand-content">
            <div class="brand-logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SIGGO" class="brand-logo-img">
            </div>
            <h1 class="brand-title">
                <span class="brand-title-dark">SIGG</span><span class="brand-title-light">O</span>
            </h1>
            <p class="brand-subtitle">Integrated Management System for<br>Guards and Operations</p>
            <div class="brand-divider"></div>
            <p class="brand-desc">Bienvenido/a</p>
        </div>
    </div>

    <!-- SECCIÓN: Panel derecho con el formulario de inicio de sesión -->
    <div class="login-form-panel">

        <div class="form-container">

            <!-- SECCIÓN: Encabezado del formulario -->
            <div class="form-header">
                <h2>Iniciar Sesión</h2>
                <p>Ingrese sus credenciales institucionales</p>
            </div>

            <!-- SECCIÓN: Alerta de error de autenticación -->
            {% if error %}
            <div class="alert-error">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <!-- SECCIÓN: Formulario de credenciales -->
            <form action="{{ url_for('login.login') }}" method="POST" autocomplete="on" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="field">
                    <label class="field-label">Usuario</label>
                    <div class="field-input">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" name="usuario" required autocomplete="username" placeholder="usuario@oigperu.com">
                    </div>
                </div>

                <div class="field">
                    <label class="field-label">Contraseña</label>
                    <div class="field-input">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    <span>Iniciar Sesión</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M5 12h14"/>
                        <path d="M12 5l7 7-7 7"/>
                    </svg>
                </button>

            </form>


        </div>

    </div>

</div>

</body>
</html>
