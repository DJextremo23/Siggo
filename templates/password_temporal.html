<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contraseña temporal</title>
<style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#f1f5f9; font-family:'Segoe UI',Arial,sans-serif; color:#0f172a; }
    .card { background:#fff; width:100%; max-width:480px; padding:32px; border-radius:12px; box-shadow:0 10px 30px rgba(15,23,42,.12); border:1px solid #e2e8f0; text-align:center; }
    .icon { width:56px; height:56px; margin:0 auto 16px; border-radius:50%; background:#eff6ff; color:#2563eb; display:flex; align-items:center; justify-content:center; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { font-size:14px; color:#475569; line-height:1.6; margin:0 0 20px; }
    .clave { font-family:'Consolas','Courier New',monospace; font-size:22px; font-weight:700; letter-spacing:1px; background:#1e3a8a; color:#fff; padding:14px; border-radius:8px; word-break:break-all; margin:0 0 20px; }
    .aviso { font-size:12px; color:#b45309; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:10px; margin:0 0 24px; text-align:left; }
    .btn { display:inline-block; background:#1e3a8a; color:#fff; text-decoration:none; font-size:14px; padding:10px 20px; border-radius:8px; }
</style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <h1>Cuenta desbloqueada</h1>
        <p>Se desbloqueó la cuenta de <strong>{{ usuario }}</strong>. La siguiente contraseña temporal se muestra una sola vez; entréguela por un canal seguro.</p>
        <div class="clave">{{ password_temporal }}</div>
        <p class="aviso">El usuario deberá cambiar esta contraseña al iniciar sesión. Este valor no se volverá a mostrar.</p>
        <a class="btn" href="{{ url_for('fiscalizadores.listar_fiscalizadores') }}">Volver a usuarios</a>
    </div>
</body>
</html>
