<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/favicon.png') }}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Informe</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='fiscal/registrar_informe.css') }}">
    <style nonce="{{ csp_nonce() }}">
        .combobox {
            position: relative;
            flex: 1;
            width: 100%;
        }
        .combobox-native-hidden {
            position: absolute !important;
            width: 1px !important;
            height: 1px !important;
            opacity: 0;
            pointer-events: none;
        }
        .combobox-control {
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        .combobox-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            padding: 13px 0;
            font-size: 14px;
            color: var(--text-main);
            font-family: inherit;
            width: 100%;
        }
        .combobox-input::placeholder {
            color: #94a3b8;
            font-size: 13px;
        }
        .combobox-chevron {
            flex-shrink: 0;
            display: flex;
            color: #94a3b8;
            transition: transform var(--transition);
        }
        .combobox.open .combobox-chevron {
            transform: rotate(180deg);
            color: var(--azul);
        }
        .combobox-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            max-height: 260px;
            overflow-y: auto;
            z-index: 50;
        }
        .combobox-group-label {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
            background: #f1f5f9;
            text-transform: uppercase;
            letter-spacing: .3px;
        }
        .combobox-option {
            padding: 10px 12px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
        }
        .combobox-option:hover,
        .combobox-option.highlighted {
            background: #eff6ff;
            color: #1d4ed8;
        }
        .combobox-empty {
            padding: 14px 12px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>

<body>

{% set active_page = 'mis_informes' %}
{% include 'menu.html' %}

<div class="content">

    <!-- Página: Registrar Informe — Formulario para subir un nuevo informe de fiscalización -->

    <!-- Cabecera de la página -->
    <div class="page-header">
        <div class="page-header-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
        </div>
        <div class="page-header-text">
            <h1>Registrar Informe</h1>
            <p>Sube un archivo Excel asociado a una guardia</p>
        </div>
    </div>

    <!-- Formulario de registro: selección de guardia, título, descripción, archivo y botones de acción -->
    <div class="card">

        <div class="form-header-bar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span>Formulario de registro</span>
        </div>

        <form method="POST" enctype="multipart/form-data" class="edit-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <!-- GUARDIA -->
            <div class="field">
                <label for="id_guardia" class="field-label">Guardia</label>
                <div class="field-input">
                    <svg class="field-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    <select name="id_guardia"
                            id="id_guardia"
                            required>
                        <option value="">Seleccione guardia</option>
                        {% for anio, lista in guardias_por_anio.items() %}
                            <optgroup label="{{ anio }}">
                                {% for g in lista %}
                                    <option value="{{ g.id_guardia }}">
                                        {{ g.fecha_guardia|fecha }}
                                    </option>
                                {% endfor %}
                            </optgroup>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- TITULO -->
            <div class="field">
                <label for="titulo" class="field-label">Título</label>
                <div class="field-input">
                    <svg class="field-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                    </svg>
                    <input type="text"
                           id="titulo"
                           name="titulo"
                           placeholder="Título del informe"
                           required>
                </div>
            </div>

            <!-- DESCRIPCION -->
            <div class="field">
                <label for="descripcion" class="field-label">Descripción</label>
                <div class="field-input field-input-textarea">
                    <svg class="field-icon field-icon-top" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"/>
                        <line x1="8" y1="12" x2="21" y2="12"/>
                        <line x1="8" y1="18" x2="21" y2="18"/>
                        <line x1="3" y1="6" x2="3.01" y2="6"/>
                        <line x1="3" y1="12" x2="3.01" y2="12"/>
                        <line x1="3" y1="18" x2="3.01" y2="18"/>
                    </svg>
                    <textarea id="descripcion"
                              name="descripcion"
                              rows="4"
                              placeholder="Descripción del informe"></textarea>
                </div>
            </div>

            <!-- ARCHIVO -->
            <div class="field">
                <label for="archivo" class="field-label">Archivo (Excel)</label>
                <div class="field-input">
                    <svg class="field-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    <input type="file"
                           id="archivo"
                           name="archivo"
                           accept=".xlsx,.xlsm"
                           required
                           class="file-input">
                </div>
            </div>

            <!-- BOTONES -->
            <div class="form-actions">
                <button type="submit" class="btn-submit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Guardar Informe
                </button>

                <a href="{{ url_for('informe.mis_informes') }}"
                   class="btn-cancel">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                    Cancelar
                </a>
            </div>

        </form>

    </div>

</div>

<script nonce="{{ csp_nonce() }}">
(function() {
    var select = document.getElementById('id_guardia');
    if (!select) return;

    var fieldInput = select.closest('.field-input');
    if (!fieldInput) return;

    select.classList.add('combobox-native-hidden');

    var wrapper = document.createElement('div');
    wrapper.className = 'combobox';

    var control = document.createElement('div');
    control.className = 'combobox-control';

    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'combobox-input';
    input.placeholder = 'Seleccione guardia';
    input.autocomplete = 'off';
    input.setAttribute('aria-label', 'Seleccione guardia');

    var chevron = document.createElement('span');
    chevron.className = 'combobox-chevron';
    chevron.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';

    control.appendChild(input);
    control.appendChild(chevron);

    var dropdown = document.createElement('div');
    dropdown.className = 'combobox-dropdown';
    dropdown.hidden = true;

    var emptyMsg = document.createElement('div');
    emptyMsg.className = 'combobox-empty';
    emptyMsg.textContent = 'Sin resultados';
    dropdown.appendChild(emptyMsg);

    wrapper.appendChild(control);
    wrapper.appendChild(dropdown);

    select.parentNode.insertBefore(wrapper, select);

    var items = [];

    Array.prototype.forEach.call(select.querySelectorAll('optgroup'), function(group) {
        var groupEl = document.createElement('div');
        groupEl.className = 'combobox-group';

        var label = document.createElement('div');
        label.className = 'combobox-group-label';
        label.textContent = group.label;
        groupEl.appendChild(label);

        Array.prototype.forEach.call(group.querySelectorAll('option'), function(option) {
            var opt = document.createElement('div');
            opt.className = 'combobox-option';
            opt.textContent = option.text;
            opt.dataset.value = option.value;
            groupEl.appendChild(opt);
            items.push({ el: opt, value: option.value, text: option.text, groupEl: groupEl });
        });

        dropdown.appendChild(groupEl);
    });

    var open = false;
    var highlightIndex = -1;

    function setValue(value, text) {
        select.value = value;
        input.value = text || '';
    }

    function restoreDisplay() {
        var selected = select.querySelector('option[value="' + select.value + '"]');
        input.value = selected && selected.value ? selected.text : '';
    }

    function toggleDropdown(show) {
        open = show;
        dropdown.hidden = !show;
        wrapper.classList.toggle('open', show);
    }

    function visibleItems() {
        return items.filter(function(item) {
            return item.el.style.display !== 'none';
        });
    }

    function clearHighlight() {
        items.forEach(function(item) { item.el.classList.remove('highlighted'); });
    }

    function setHighlight(index) {
        var vis = visibleItems();
        if (vis.length === 0) { highlightIndex = -1; return; }
        if (index < 0) index = 0;
        if (index >= vis.length) index = vis.length - 1;
        highlightIndex = index;
        clearHighlight();
        vis[index].el.classList.add('highlighted');
        vis[index].el.scrollIntoView({ block: 'nearest' });
    }

    function filter(term) {
        term = term.toLowerCase().trim();
        var anyVisible = false;
        items.forEach(function(item) {
            var match = term === '' || item.text.toLowerCase().indexOf(term) !== -1;
            item.el.style.display = match ? '' : 'none';
            if (match) anyVisible = true;
        });
        var grupos = dropdown.querySelectorAll('.combobox-group');
        Array.prototype.forEach.call(grupos, function(g) {
            var visibles = Array.prototype.some.call(
                g.querySelectorAll('.combobox-option'),
                function(o) { return o.style.display !== 'none'; }
            );
            g.style.display = visibles ? '' : 'none';
        });
        emptyMsg.style.display = anyVisible ? 'none' : '';
        highlightIndex = -1;
        clearHighlight();
    }

    function choose(item) {
        setValue(item.value, item.text);
        toggleDropdown(false);
    }

    input.addEventListener('focus', function() {
        toggleDropdown(true);
        filter(input.value);
    });

    input.addEventListener('input', function() {
        if (!open) toggleDropdown(true);
        filter(input.value);
    });

    input.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (!open) { toggleDropdown(true); filter(input.value); }
            setHighlight(highlightIndex + 1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setHighlight(highlightIndex - 1);
        } else if (e.key === 'Enter') {
            if (open) {
                var vis = visibleItems();
                if (highlightIndex >= 0 && vis[highlightIndex]) {
                    e.preventDefault();
                    choose(vis[highlightIndex]);
                }
            }
        } else if (e.key === 'Escape') {
            toggleDropdown(false);
            restoreDisplay();
        } else if (e.key === 'Tab') {
            toggleDropdown(false);
        }
    });

    dropdown.addEventListener('mousedown', function(e) {
        e.preventDefault();
    });

    dropdown.addEventListener('click', function(e) {
        var opt = e.target.closest('.combobox-option');
        if (opt) {
            choose({ value: opt.dataset.value, text: opt.textContent });
        }
    });

    document.addEventListener('click', function(e) {
        if (!wrapper.contains(e.target)) {
            toggleDropdown(false);
            restoreDisplay();
        }
    });

    restoreDisplay();
})();
</script>

</body>
</html>
