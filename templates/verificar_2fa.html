<!-- Verificar código 2FA -->
<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar 2FA — SIGGO</title>
<link rel="stylesheet" href="{{ url_for('static', filename='verificar_2fa.css') }}">
</head>

<body class="login-body">

<div class="login-wrapper">

    <!-- PANEL IZQUIERDO — MARCA -->
    <div class="login-brand">
        <div class="brand-content">
            <div class="brand-logo">
                <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SIGGO" class="brand-logo-img">
            </div>
            <h1 class="brand-title">
                <span class="brand-title-dark">SIGG</span><span class="brand-title-light">O</span>
            </h1>
            <p class="brand-subtitle">Integrated Management System for<br>Guards and Operations</p>
            <div class="brand-divider"></div>
            <p class="brand-desc">Autenticación en dos pasos</p>
        </div>
    </div>

    <!-- PANEL DERECHO — VERIFICACIÓN 2FA -->
    <div class="login-form-panel">

        <div class="form-container">

            <div class="form-header">
                <h2>Código de verificación</h2>
                <p>Ingrese el código de 6 dígitos de su aplicación de autenticación</p>
            </div>

            {% if error %}
            <div class="alert-error">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" autocomplete="off" novalidate>
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="field">
                    <label class="field-label" for="codigo">Código TOTP</label>
                    <div class="field-input totp-input">
                        <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            <circle cx="12" cy="16" r="1"/>
                        </svg>
                        <input
                            type="text"
                            name="codigo"
                            id="codigo"
                            inputmode="numeric"
                            pattern="[0-9]{6}"
                            maxlength="6"
                            autocomplete="one-time-code"
                            placeholder="000000"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <div class="field field--checkbox">
                    <label class="checkbox-label">
                        <input type="checkbox" name="recordar_dispositivo" value="1">
                        <span>Recordar este dispositivo por 30 días</span>
                    </label>
                </div>

                <button type="submit" class="btn-login">
                    <span>Verificar</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <path d="M5 12h14"/>
                        <path d="M12 5l7 7-7 7"/>
                    </svg>
                </button>

                <div class="form-footer">
                    <a href="{{ url_for('login.login') }}">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M19 12H5"/>
                            <path d="M12 19l-7-7 7-7"/>
                        </svg>
                        Volver al inicio de sesión
                    </a>
                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
